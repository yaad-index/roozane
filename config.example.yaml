# Roozane configuration.
#
# Everything the engine does is decided here: which sources it reads, how often,
# what "relevant" means, and where the digest comes from. Adding a source is a
# change to this file and never a change to the code (ADR-0001).
#
# Relative paths resolve against this file's directory, so a config and its data
# move together.

# Root for everything on disk: collected items, digests, aggregator state
# (ADR-0002). Default: data
data_root: data

# The reader-owned description of what matters to them. Prose, in a file you
# edit — the engine never infers this. It is fed to the aggregator as prompt
# input on every run. Default: profile.md
relevance_profile: profile.md

# Two independent windows, both counted in UTC days (ADR-0002). Each collection
# pass enforces them before it collects. A window of N keeps the newest N days:
# `items: 1` keeps today alone.
retention:
  # Prunes day folders under days/. Default: 90
  #
  # Must be at least as long as the longest cadence below, or a source's items
  # would be pruned before it is due again and it would be re-fetched on every
  # pass. Config validation rejects a shorter window.
  items: 90
  # Prunes the digests/ tree. 0 keeps them forever, which is the default:
  # digests are small and are the record worth keeping.
  digests: 0

# The one layer with a brain. It speaks the standard chat-completions API shape
# and is described by endpoint and model names only — point it at whichever
# service you use; the engine neither assumes nor endorses one.
aggregator:
  # Root of the chat-completions endpoint.
  base_url: https://api.example.com/v1

  # The NAME of the environment variable holding your credential — not the
  # credential. Keeping it a reference is what makes this file safe to commit,
  # diff and share. A pasted key is rejected at load rather than silently
  # treated as a variable name that never resolves.
  api_key_env: ROOZANE_API_KEY

  # Cost scales with the size of the task: a small model reads each item, a
  # larger one writes the day's digest (ADR-0001).
  models:
    item: your-small-model
    digest: your-large-model

  # Per-request timeout. Default: 60s
  timeout: 60s

# The source list. Each key is a source id: it becomes a path component of every
# item that source collects (ADR-0002), so it is restricted to lower-case
# letters, digits and single hyphens.
#
# Every entry carries its own cadence — daily, weekly or monthly.
sources:
  example-feed:
    collector: feed
    cadence: daily
    params:
      url: https://example.com/feed.xml

  example-site:
    collector: http
    cadence: weekly
    # Optional: the ONLY environment variables this source's collector receives
    # (ADR-0003). Names, never values — nothing else is passed through.
    env:
      - EXAMPLE_SITE_TOKEN
    params:
      url: https://example.com/updates

  # An exec source runs a program of your own as the collector (ADR-0003). The
  # engine sends it {"contract":1,"source":"<id>","params":{…}} on stdin; the
  # program writes one JSON object per line to stdout:
  #
  #   {"url":"…","title":"…","source_time":"2026-09-05T06:30:00Z","content":"…"}
  #
  # Only `content` is required. The engine stamps the collection time itself, so
  # `source_time` is kept as provenance and never decides which day the item
  # files under. Exit 0 means success; anything else marks the run failed and
  # stderr is captured. A malformed line is skipped, not fatal.
  #
  # The program runs with this engine's privileges — the config is the trust
  # boundary — so the engine refuses to start if the config file or any program
  # named here is writable by other users. Keep both at go-w.
  #
  # example-plugin:
  #   collector: exec
  #   cadence: daily
  #   command: [/usr/local/lib/roozane/example-collector]
  #   env:
  #     - EXAMPLE_PLUGIN_TOKEN
  #   params:
  #     list: hot

# Newsletters and other hand-offs do not appear here. External tools drop files
# into <data_root>/inbox/ and the next collector run takes them from there
# (ADR-0002) — the engine never reaches outside its data root for input.

# Where the digest goes. Optional: with no sinks the digest is still written
# under <data_root>/digests/, which is a complete pipeline if files are all you
# want. Each key is a sink id, same shape as a source id.
#
# Give each sink EITHER `type` (a built-in delivery) OR `command` (an external
# program run under the ADR-0003 contract) — never both.
sinks:
  # Built-in: write the digest to a path. `{day}` is replaced with the digest's
  # UTC day, so this keeps one file per day; leave it out to overwrite one file.
  # `format` is markdown (default) or json.
  local-file:
    type: file
    params:
      path: digests/{day}.md
      format: markdown

  # Built-in: send the digest as a chat message. `token_env` names the variable
  # holding the bot token — a reference, never the token itself. A digest longer
  # than the platform's message limit is split, never truncated.
  chat:
    type: telegram
    params:
      chat_id: "your-chat-id"
      token_env: TELEGRAM_BOT_TOKEN

  # External: any program, run under the ADR-0003 contract. It receives
  # {"contract": 1, "sink": "<id>", "params": {...}, "digest": {...}} on stdin;
  # its exit code is the delivery result and its stdout is logged. It gets only
  # PATH, locale and the variables named in `env` — nothing else is passed
  # through.
  example-script:
    command: ["/usr/local/bin/notify", "--quiet"]
    env:
      - EXAMPLE_NOTIFY_TOKEN
    params:
      destination: "your-destination-id"
