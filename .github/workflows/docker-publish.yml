# Build and publish the container image to GHCR (#31).
#
# On a published release, push the versioned tags plus `latest`; release-please
# cuts the releases. On a push to main, push a rolling `main` tag and a short-sha
# tag for testing something before it is released. Images are multi-arch
# (amd64 + arm64).
#
# The version stamp is built and read back BEFORE anything is pushed. An image
# whose binary reports "dev" — or reports a different version from the tag it is
# about to be published under — is a mislabelled release, and the only cheap
# moment to catch that is before `latest` has moved onto it.
#
# Auth is the built-in GITHUB_TOKEN against ghcr.io: no PAT, no extra secret.

name: docker-publish

on:
  release:
    types: [published]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/yaad-index/roozane

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Releases are tagged plain vX.Y.Z, so semver parses them directly and
          # emits the version without the leading v. major.minor gives a tag that
          # follows patch releases; latest moves only on a release, never on a
          # main push.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=ref,event=branch
            type=sha
          labels: |
            org.opencontainers.image.title=Roozane
            org.opencontainers.image.description=A personal news engine: config-driven collectors, one aggregator, pluggable sinks.
            org.opencontainers.image.source=https://github.com/yaad-index/roozane
            org.opencontainers.image.licenses=MIT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Gate on the resolved version BEFORE building or pushing. The metadata
      # step has fully resolved it by here, so a tag-config change that resolves
      # it to something useless — a bare sha, an empty string — fails now rather
      # than after an image has been published under it. Shape, not equality to
      # the git tag: v0.2.0 correctly resolves to 0.2.0, so an equality check
      # would fail a good build. Release only; a main push legitimately resolves
      # to "main".
      - name: Assert the resolved release version is semver-shaped
        if: github.event_name == 'release'
        env:
          RESOLVED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Anchored both ends; the optional tail is a semver prerelease (-) or
          # build (+) suffix. A leading dot is not valid, so a fourth numeric
          # component (0.2.0.1) and any trailing garbage are rejected.
          if ! printf '%s\n' "$RESOLVED_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "resolved release version '$RESOLVED_VERSION' is not semver-shaped: refusing to build and publish a mislabelled image"
            exit 1
          fi
          echo "resolved release version is semver-shaped: $RESOLVED_VERSION"

      # Build single-arch and load it, so the stamp can be read back out of a
      # real image before any push. Native amd64 only (no QEMU, no push); the
      # layers feed the cache the multi-arch push below reuses, so the cost is
      # one extra amd64 build on releases.
      - name: Build single-arch and verify the version stamp
        if: github.event_name == 'release'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ env.IMAGE }}:verify-stamp
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert the pre-publish image reports the resolved version
        if: github.event_name == 'release'
        env:
          IMAGE_REF: ${{ env.IMAGE }}:verify-stamp
          RESOLVED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Equality, not shape: a well-formed stamp can still be the WRONG
          # version, and an image tagged 0.2.0 that reports 0.1.0 is exactly the
          # mislabelling worth blocking. The shape gate above asks the different
          # question of whether tag resolution produced anything usable at all.
          got="$(docker run --rm "$IMAGE_REF" version)"
          if [ "$got" != "$RESOLVED_VERSION" ]; then
            echo "pre-publish image reports '$got', not the resolved release version '$RESOLVED_VERSION': VERSION was not forwarded into the build — refusing to push a mislabelled image"
            exit 1
          fi
          echo "pre-publish image reports the resolved version: $got"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Stamp the resolved version at link time so the image can be asked
          # what it is. On a release this is the version from the tag; on a main
          # push it is "main". The Dockerfile derives one from git when this is
          # empty, so a source build is never silently "dev".
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # After the tags are applied: pull the pinnable tag and confirm what an
      # operator actually gets reports the right version, end to end. The
      # pre-publish check proved the build forwarded VERSION; this proves the
      # published tag resolves to that image.
      - name: Assert the released image reports the resolved version
        if: github.event_name == 'release'
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          RESOLVED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          got="$(docker run --rm "$IMAGE_REF" version)"
          if [ "$got" != "$RESOLVED_VERSION" ]; then
            echo "released image ($IMAGE_REF) reports '$got', not '$RESOLVED_VERSION': the pinnable tag resolves to a mislabelled image"
            exit 1
          fi
          echo "released image reports the resolved version: $got"
