# Build, vet, test and lint (#4).
#
# This runs on the pull request AND on the push that lands it. Those are not the
# same commit: a squash onto a base that has moved produces a combination no run
# has ever covered, because the PR's checks validated the branch against an older
# base. docker-publish builds and pushes from exactly that commit, so without a
# run here the only thing standing between an untested merge and a published
# image is whether it compiles — a behavioural regression publishes silently.
#
# This reports after the fact rather than preventing it, which is the limit of a
# trigger. Preventing it means requiring the branch to be current before merging,
# and that is branch protection rather than anything a workflow can do.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Track the version pinned in go.mod so CI and the module stay in
          # lockstep — single source of truth.
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pin the linter version so CI matches the local run (same reasoning as
          # go-version-file above); Dependabot bumps it deliberately.
          version: v2.11.4

      - name: Test
        # -race from the start: the three layers hand off through the filesystem
        # and the aggregator is the layer most likely to grow concurrency, so the
        # detector is on before there is anything for it to catch.
        run: go test -race ./...

  # This builds the Dockerfile on the pull request that changes it, rather than
  # leaving it to be discovered when someone is trying to cut a release.
  #
  # It is not a duplicate of docker-publish on a main push. That workflow's
  # stamp and smoke assertions are all release-only, so the image it builds and
  # pushes from a main commit is otherwise never run at all — this job is the
  # only thing that executes one.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Native amd64 and no push: this asks whether the Dockerfile is
          # buildable and the image runnable, not whether it publishes.
          platforms: linux/amd64
          load: true
          push: false
          tags: roozane:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        # Building is not the whole contract. The image is invoked by a
        # scheduler that names a subcommand and reads an exit code, so the two
        # things worth proving here are that the entrypoint executes at all and
        # that running it bare is a usage error rather than a silent success —
        # an image that builds but cannot run is still broken on release day.
        run: |
          got="$(docker run --rm roozane:ci version)"
          if [ -z "$got" ]; then
            echo "the built image does not report a version: the entrypoint or the ldflag stamp is broken"
            exit 1
          fi
          echo "built image reports: $got"

          if docker run --rm roozane:ci; then
            echo "running the image with no subcommand succeeded; it must be a usage error so a scheduler cannot mistake a missing argument for a completed pass"
            exit 1
          fi
          echo "no-subcommand run correctly exits non-zero"
